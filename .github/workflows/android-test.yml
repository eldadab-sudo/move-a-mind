name: Build Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'capacitor.config.ts'
      - 'web/global.html'
      - 'web/offline.html'
      - 'package.json'
      - '.github/workflows/android-test.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare web entry and install dependencies
        run: |
          test -f web/index.html || cp web/global.html web/index.html
          npm install --no-audit --no-fund
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply Move A Mind launcher icon
        run: |
          python -m pip install Pillow
          curl -fLsS --retry 3 --max-time 30 'https://move-a-mind-v08-production.up.railway.app/move-a-mind-logo.webp' -o /tmp/mam-logo.webp
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('/tmp/mam-logo.webp').convert('RGBA')
          for folder,px in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              dest=Path('android/app/src/main/res')/folder
              dest.mkdir(parents=True,exist_ok=True)
              im.resize((px,px),Image.Resampling.LANCZOS).save(dest/'ic_launcher.png')
              im.resize((px,px),Image.Resampling.LANCZOS).save(dest/'ic_launcher_round.png')
          PY
      - name: Configure Android permissions and app label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: move-a-mind-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
